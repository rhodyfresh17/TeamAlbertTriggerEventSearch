name: Trigger Event Scraper

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
  # A push runs ONLY the `tests` job (the scrape job is guarded below), so the
  # golden set is checked whenever code changes — never an extra scrape.
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Phase 4 (review 2026-09-08): the golden set + gate + config tests run in
  # their OWN job, only when code changes (push / workflow_dispatch) — never
  # on the 4-hourly schedule and never inside the scrape job. A golden-set
  # flip means a decision changed with the code; it must never block or fail
  # a scheduled scrape and its Supabase sync. No `needs` in either direction.
  # tests/test_golden.py::test_ci_shape pins this layout.
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        # Only stdlib + requests/PyYAML are needed by these test files;
        # pytest is pinned to a major range so a new major cannot break CI.
        run: |
          pip install --upgrade pip
          pip install "requests>=2.28.0" "PyYAML>=6.0" "pytest>=8,<10"

      - name: Golden set + gate + config tests
        # The free decision functions are asserted against tests/golden/accounts.json
        # so a scraper/gate change can never silently flip a decision already made.
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_golden.py tests/test_gates.py tests/test_config.py

  scrape:
    # Unchanged from before Phase 4 except this guard: a push never scrapes
    # (schedule + workflow_dispatch only, exactly the triggers it always had).
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Normal runs take ~7 min; slow SEC/Google days spike past 10 (the
    # 2026-08-06 17:44Z run was killed by the old 10-min cap → "All jobs
    # were cancelled" email). 15 gives hang-protection with real headroom.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      # Cache the database to prevent duplicate alerts
      - name: Cache database
        uses: actions/cache@v4.2.3
        with:
          path: trigger_events.db
          key: trigger-events-db-v2-${{ github.run_id }}
          restore-keys: |
            trigger-events-db-v2-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "requests>=2.28.0" "PyYAML>=6.0"
          pip list | grep -E "requests|PyYAML"

          # Verify imports work
          python3 -c "import requests; import yaml; print('Dependencies OK')"

      - name: Setup config
        run: |
          cp config.example.yaml config.yaml

          # Show database status
          if [ -f trigger_events.db ]; then
            echo "Database found ($(stat -c%s trigger_events.db) bytes)"
          else
            echo "No existing database - first run"
          fi

      - name: Verify module loads
        run: |
          python3 -c "from src.main import TriggerEventMonitor; print('Module OK')"

      - name: Run scraper
        env:
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python -m src.main

      - name: Show database status
        if: always()
        run: |
          if [ -f trigger_events.db ]; then
            echo "Database size: $(stat -c%s trigger_events.db) bytes"
            python3 -c "
          import sqlite3
          conn = sqlite3.connect('trigger_events.db')
          cursor = conn.cursor()
          cursor.execute('SELECT COUNT(*) FROM events')
          print(f'Total events in database: {cursor.fetchone()[0]}')
          cursor.execute('SELECT COUNT(*) FROM seen_urls')
          print(f'Total URLs seen: {cursor.fetchone()[0]}')
          conn.close()
          "
          fi

      - name: Sync to Supabase
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            pip install supabase
            python3 supabase_sync.py
          else
            echo "Supabase not configured - skipping sync"
          fi

      # Enrichment runs on the Mac (free local LLM), never in CI — the old
      # "Enrich companies (Scout)" step and its TAVILY/ANTHROPIC/APOLLO secret
      # wiring were removed 2026-09-06.

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: alerts-${{ github.run_number }}
          path: alerts/
          retention-days: 30
          if-no-files-found: ignore
